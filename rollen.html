<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rollen - Online Weerwolven van Whatsapperdam</title>

  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/roles.css" />
  <link rel="icon" href="images/favicon.ico">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Online Weerwolven van Whatsapperdam</h1>
      <p class="subtitle">Rollen</p>
    </div>
  </header>

  <nav class="main-nav">
    <div class="container nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="spelverloop.html" class="nav-link">Spelverloop</a>
      <a href="regels.html" class="nav-link">Regels</a>
      <div class="nav-dropdown active">
        <button class="nav-dropdown-toggle" type="button">Rollen &amp; Talenten</button>
        <div class="nav-dropdown-menu">
          <a href="rollen.html">Rollen</a>
          <a href="talenten.html">Talenten</a>
        </div>
      </div>
      <div class="nav-dropdown">
        <button class="nav-dropdown-toggle" type="button">Modules</button>
        <div class="nav-dropdown-menu">
          <a href="spelopties.html">Spelopties</a>
          <a href="uitbreidingen.html">Uitbreidingen</a>
        </div>
      </div>
      <a href="appendices.html" class="nav-link">Appendices</a>
    </div>
  </nav>

  <main class="container page-content">
    <section class="content-card roles-intro-card">
      <h2>Alle rollen</h2>
      <p>Klik op een rol om de uitleg te bekijken.</p>
    </section>

    <section class="filters-section">
      <div class="filters-header">
        <div>
          <h2>Zoeken en filters</h2>
          <p>Zoek op naam en filter op alliantie of type.</p>
        </div>
      </div>

      <div class="filters-grid">
        <div class="filter-group filter-group-search">
          <label for="role-search">Zoeken</label>
          <input
            type="text"
            id="role-search"
            placeholder="Zoek een rol..."
            autocomplete="off"
          />
        </div>

        <div class="filter-group">
          <label for="alliance-filter">Alliantie</label>
          <select id="alliance-filter">
            <option value="all">Alle allianties</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="type-filter">Type</label>
          <select id="type-filter">
            <option value="all">Alle types</option>
          </select>
        </div>
      </div>
    </section>

    <section id="roles-list"></section>
  </main>

  <div id="role-modal" class="role-modal hidden">
    <div class="role-modal-backdrop"></div>

    <div class="role-modal-content">
      <button id="role-modal-close" class="role-modal-close" type="button" aria-label="Sluiten">&times;</button>
      <button id="role-modal-previous" class="role-modal-navigation role-modal-previous" type="button" aria-label="Vorige rol">&#10094;</button>
      <button id="role-modal-next" class="role-modal-navigation role-modal-next" type="button" aria-label="Volgende rol">&#10095;</button>

      <div class="role-modal-body">
        <img id="modal-role-image" class="role-modal-image" alt="">

        <div class="role-modal-text">
          <h2 id="modal-role-name"></h2>

          <div class="meta-block">
            <strong>Alliantie</strong>
            <div id="modal-role-alliance" class="badges"></div>
          </div>

          <div class="meta-block">
            <strong>Afkomst</strong>
            <div id="modal-role-origin" class="badges"></div>
          </div>

          <div class="meta-block">
            <strong>Type</strong>
            <div id="modal-role-types" class="badges"></div>
          </div>

          <p id="modal-role-description"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/data/roles-data.js"></script>
  <script src="js/scripts/roles.js"></script>
  <script src="js/scripts/navigation.js"></script>
</body>
</html>
